# DRAFT — builds a checksummed linux binary and attaches it to a GitHub Release on a `v*` tag.
# The swoosh-action install step downloads these assets. Needs a tag push to validate.
name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: build
        run: cargo build --release -p swoosh
      - name: package + checksum
        run: |
          out=swoosh-x86_64-linux
          cp target/release/swoosh "$out"
          sha256sum "$out" | awk '{print $1}' > "$out.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            swoosh-x86_64-linux
            swoosh-x86_64-linux.sha256
