# Builds checksummed linux + macOS binaries and attaches them to a GitHub Release on a `v*` tag.
# swoosh declares its theia crates as git deps, so cargo fetches them from GitHub at build time; no sibling
# checkout is needed. NOTE: those git deps are unpinned (default-branch HEAD), so a tag is not yet fully
# reproducible; pin a rev per release to fix (see the release-reproducibility entry in notes/02-DECISIONS.md).
name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write      # mint the OIDC token the attestation is signed with (keyless, no key to manage)
  attestations: write  # record the signed build-provenance attestation for each binary

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: swoosh-x86_64-linux
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: swoosh-aarch64-linux
          - runner: macos-14
            target: aarch64-apple-darwin
            asset: swoosh-aarch64-macos
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: swoosh
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: build
        working-directory: swoosh
        run: cargo build --release --locked -p swoosh --target ${{ matrix.target }}
      - name: package + checksum
        run: |
          cp "swoosh/target/${{ matrix.target }}/release/swoosh" "${{ matrix.asset }}"
          shasum -a 256 "${{ matrix.asset }}" | awk '{print $1}' > "${{ matrix.asset }}.sha256"
      - name: attest build provenance
        # Keyless (sigstore/OIDC, no key to manage): records a signed provenance attestation binding this
        # binary to the workflow that built it. Verify with `gh attestation verify <bin> --repo theia-hq/swoosh`.
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ matrix.asset }}
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sha256
