# Builds checksummed linux + macOS binaries and attaches them to a GitHub Release on a `v*` tag.
# swoosh declares its theia crates as git deps pinned to an exact rev (see swoosh/Cargo.toml), so cargo
# fetches them from GitHub at build time; no sibling checkout is needed. Reproducibility lives in those
# Cargo.toml rev pins (decision (A) in notes/02-DECISIONS.md, "Release reproducibility" [2026-08-30]), NOT
# in a `--locked` committed lock: option (B), a git-pinned lock + `--locked`, was explicitly REJECTED there
# because the local .cargo/config.toml path-patch rewrites the committed lock on every local build, so an
# enforced lock is unstable in this container-of-repos workflow. The build is therefore NOT `--locked`; the
# committed lock is a soft baseline (keeps transitive deps steady) that cargo reconciles in place. The
# `verify reproducible pins` step asserts the rev pins in Cargo.toml (the single source of truth).
name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write      # mint the OIDC token the attestation is signed with (keyless, no key to manage)
  attestations: write  # record the signed build-provenance attestation for each binary

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: swoosh-x86_64-linux
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: swoosh-aarch64-linux
          - runner: macos-14
            target: aarch64-apple-darwin
            asset: swoosh-aarch64-macos
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: swoosh
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: build
        working-directory: swoosh
        # NOT --locked (decision (A)): reproducibility comes from the exact git revs pinned in Cargo.toml, not
        # from enforcing the committed lock. The checkout is at `swoosh/` with no parent .cargo/config.toml, so
        # there is no path patch: cargo fetches each sibling at its pinned rev exactly as an outside user would,
        # and reconciles the committed lock (a soft transitive baseline) in place rather than failing on drift.
        run: cargo build --release -p swoosh --target ${{ matrix.target }}
      - name: verify reproducible pins
        working-directory: swoosh
        # Reproducibility contract under decision (A): every sibling git dep in Cargo.toml carries an exact
        # 40-char rev. In CI there is no path patch, so a pinned rev means the build fetched that exact commit.
        # We assert the manifest (the single source of truth), not the lock, which is deliberately non-binding.
        run: |
          set -euo pipefail
          fail=0
          for repo in nauthy tightbeam bifrost; do
            rev=$(sed -n "s|.*\"https://github.com/theia-hq/${repo}\", rev = \"\([0-9a-f]\{40\}\)\".*|\1|p" Cargo.toml | head -n1)
            if [ -z "$rev" ]; then
              echo "FAIL: no pinned rev for '$repo' in Cargo.toml (expected a 40-char sha)"; fail=1
            else
              echo "OK: $repo pinned to git rev $rev in Cargo.toml"
            fi
          done
          exit $fail
      - name: package + checksum
        run: |
          cp "swoosh/target/${{ matrix.target }}/release/swoosh" "${{ matrix.asset }}"
          shasum -a 256 "${{ matrix.asset }}" | awk '{print $1}' > "${{ matrix.asset }}.sha256"
      - name: attest build provenance
        # Keyless (sigstore/OIDC, no key to manage): records a signed provenance attestation binding this
        # binary to the workflow that built it. Verify with `gh attestation verify <bin> --repo theia-hq/swoosh`.
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ matrix.asset }}
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sha256
