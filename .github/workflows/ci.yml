# Build, test, and lint every PR and push to main in the PATCH-FREE (shipping-form) environment, so a
# stale sibling rev pin or a lock that does not resolve fails HERE, not at the tag. --locked is correct on
# PR and does NOT reopen decision (A) (which governs the tag build, notes/02-DECISIONS.md): lock-guard.sh
# keeps the committed lock in shipping-form, so --locked in the patch-free checkout proves it resolves.
name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: lock guard
        run: sh scripts/lock-guard.sh .
      - name: build
        run: cargo build --locked
      - name: test
        run: cargo test --locked
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      # Run cargo-deny on the runner (not the action's container): swoosh pins a toolchain in
      # rust-toolchain.toml, which the containerized action cannot honor. On the runner, rustup resolves it.
      - name: install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: cargo-deny (sources)
        run: cargo deny check sources
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - name: fmt check
        run: cargo +nightly fmt --check
