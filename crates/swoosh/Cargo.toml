[package]
name = "swoosh"
version = "0.7.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "swoosh"
path = "src/main.rs"

[features]
# `ssh` pulls in swoosh's own `sshh` dependency and injects the `sshd:` handler, so a default swoosh serves
# `tunnel expose ssh=sshd:` and `swoosh ssh` reaches it. DEFAULT-ON: the keyless shell is a headline
# capability, not an opt-in. A lean client that only reaches out (`ping`/`speed`/`fetch`) can drop the
# russh/pty tree with `--no-default-features`, keeping swoosh the one binary either way.
default = ["ssh"]
ssh = ["dep:sshh"]

[dependencies]
# theia
beam.workspace = true
bifrost.workspace = true
bifrost-core.workspace = true
bifrost-iroh.workspace = true
bifrost-mdns.workspace = true
bifrost-quirk.workspace = true
fetch.workspace = true
measure.workspace = true
nauthy.workspace = true
sshh = { workspace = true, optional = true }
tightbeam.workspace = true

clap.workspace = true
data-encoding.workspace = true
eyre.workspace = true
futures.workspace = true
httparse = "1"
rand.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "macros", "rt-multi-thread", "signal"] }
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
zeroize.workspace = true

[dev-dependencies]
# The in-process transport the `gated_measure` proof drives: two mem nodes share a global registry, so a
# client reaches the exposer by NodeId with no sockets, deterministically and in milliseconds.
bifrost-mem.workspace = true

[lints]
workspace = true
