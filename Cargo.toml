[workspace]
resolver = "3"
members = ["crates/diag", "crates/swoosh"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# theia
# Pinned to a rev for reproducible releases (see tightbeam/Cargo.toml). Root .cargo/config.toml [patch]
# overrides these with local paths for dev; bump on release with `cargo update -p <crate>`.
bifrost = { git = "https://github.com/theia-hq/bifrost", rev = "ba4fa897c80eae95ebdf874940dca2aac47100d7" }
bifrost-core = { git = "https://github.com/theia-hq/bifrost", rev = "ba4fa897c80eae95ebdf874940dca2aac47100d7" }
bifrost-iroh = { git = "https://github.com/theia-hq/bifrost", rev = "ba4fa897c80eae95ebdf874940dca2aac47100d7" }
bifrost-mdns = { git = "https://github.com/theia-hq/bifrost", rev = "ba4fa897c80eae95ebdf874940dca2aac47100d7" }
bifrost-mem = { git = "https://github.com/theia-hq/bifrost", rev = "ba4fa897c80eae95ebdf874940dca2aac47100d7" }
bifrost-quirk = { git = "https://github.com/theia-hq/bifrost", rev = "ba4fa897c80eae95ebdf874940dca2aac47100d7" }
nauthy = { git = "https://github.com/theia-hq/nauthy", rev = "1c1a15b43789a50925d06361d7a8a4cc856abedd" }
tightbeam = { git = "https://github.com/theia-hq/tightbeam", rev = "64129c25279597212a1f1ac008b8680d9e72c7f2" }
diag = { path = "crates/diag" }

clap = { version = "4", features = ["derive", "env"] }
data-encoding = "2"
eyre = "0.6"
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
rand = "0.8"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "rt-multi-thread", "sync", "time"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zeroize = { version = "1", features = ["derive"] }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
wildcard_imports = "deny"
std_instead_of_core = "warn"

[workspace.lints.rust]
unused_must_use = "deny"

# Ship a lean release binary: strip symbols, whole-program LTO, single codegen unit. Roughly halves the
# artifact at no runtime cost: only a longer release link, a CI concern rather than a user's.
[profile.release]
strip = true
lto = true
codegen-units = 1
