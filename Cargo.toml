[package]
publish = false  # git-only for now, not published to crates.io
name = "swoosh"
description = "Reach a machine by its public key and grant one person one service: ssh, files, ports, fetch. No account."
version = "0.9.1"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

# No explicit `[[bin]]`: the CLI is its own module tree under the conventional `src/bin/swoosh/`, which
# Cargo's target discovery names from the directory. The library (`src/lib.rs`) is the node engine.

[features]
# `ssh` pulls in the `sshh` engine from the services repo and binds the `sshd:` handler at the serve
# root, so a default swoosh serves `tunnel expose ssh=sshd:` and `swoosh ssh` reaches it. DEFAULT-ON: the
# keyless shell is a headline capability, not an opt-in. A lean client that only reaches out
# (`ping`/`speed`/`fetch`) can drop the russh/pty tree with `--no-default-features`, keeping swoosh the
# one binary either way.
default = ["ssh"]
ssh = ["dep:sshh"]

[dependencies]
# theia. Each sibling git-dep is pinned to an EXACT rev so a `swoosh vX` tag records exactly which
# nauthy/tightbeam/bifrost commit compiled in, instead of floating on default-branch HEAD (an unpinned
# HEAD is how a past auth-bypass slipped in unnoticed). The local dev `.cargo/config.toml` still [patch]es
# these by URL to sibling PATH checkouts, so a `rev` here does NOT slow local builds: the patch wins
# locally regardless of the rev; CI (no parent config) resolves the rev from GitHub. All bifrost-* crates
# live in one repo, so they share one rev. Bump these deliberately each release (see the reproducible-build
# gate in .github/workflows/release.yml and the lock-regen step in notes/02-DECISIONS.md).
bifrost = { git = "https://github.com/theia-hq/bifrost", rev = "dccfb1f4a82d348dc3a7b50793ff4f26f8e98962" }
bifrost-core = { git = "https://github.com/theia-hq/bifrost", rev = "dccfb1f4a82d348dc3a7b50793ff4f26f8e98962" }
bifrost-iroh = { git = "https://github.com/theia-hq/bifrost", rev = "dccfb1f4a82d348dc3a7b50793ff4f26f8e98962" }
bifrost-mdns = { git = "https://github.com/theia-hq/bifrost", rev = "dccfb1f4a82d348dc3a7b50793ff4f26f8e98962" }
bifrost-noise = { git = "https://github.com/theia-hq/bifrost", rev = "dccfb1f4a82d348dc3a7b50793ff4f26f8e98962" }
bifrost-quirk = { git = "https://github.com/theia-hq/bifrost", rev = "dccfb1f4a82d348dc3a7b50793ff4f26f8e98962" }
nauthy = { git = "https://github.com/theia-hq/nauthy", rev = "4086838c65f176a402a746ced0b7f76992171301" }
tightbeam = { git = "https://github.com/theia-hq/tightbeam", rev = "6df1983f6cb77fe65dc398e79b49cddb1ae10071" }
# theia services. The general engines (fetch, measure, sshh, transfer) live in one repo, pinned to one
# exact rev like the siblings above; the services repo pins the handler contract in turn, so this is the
# cascade's outermost hop. The local dev `.cargo/config.toml` [patch]es these by URL to path checkouts.
fetch = { git = "https://github.com/theia-hq/services", rev = "cc33c444ba9df50bfaa69b2a5d322a5c744e8cb5" }
measure = { git = "https://github.com/theia-hq/services", rev = "cc33c444ba9df50bfaa69b2a5d322a5c744e8cb5" }
sshh = { git = "https://github.com/theia-hq/services", rev = "cc33c444ba9df50bfaa69b2a5d322a5c744e8cb5", optional = true }
transfer = { git = "https://github.com/theia-hq/services", rev = "cc33c444ba9df50bfaa69b2a5d322a5c744e8cb5" }

clap = { version = "4", features = ["derive", "env"] }
data-encoding = "2"
eyre = "0.6"
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
httparse = "1"
# `service enable`/`disable` take an flock around the read-modify-write of `<home>/disabled` so two
# concurrent toggles cannot lose an edit. std file locking is MSRV-1.89 (this package targets 1.85), so
# the flock rides libc, matching how `sshh` already reaches for the same crate.
libc = "0.2"
rand = "0.8"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
# The in-process transport the `gated_measure` proof drives: two mem nodes share a global registry, so a
# client reaches the exposer by NodeId with no sockets, deterministically and in milliseconds.
bifrost-mem = { git = "https://github.com/theia-hq/bifrost", rev = "dccfb1f4a82d348dc3a7b50793ff4f26f8e98962" }

# `test-util` gives the control-client deadline test tokio's paused clock, so the 5 s read bound is
# asserted without a wall-clock wait. Dev-only: the shipped binary never compiles it in.
tokio = { version = "1", features = ["test-util"] }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
wildcard_imports = "deny"
std_instead_of_core = "warn"

[lints.rust]
unused_must_use = "deny"

# Ship a lean release binary: strip symbols, whole-program LTO, single codegen unit. Roughly halves the
# artifact at no runtime cost: only a longer release link, a CI concern rather than a user's.
[profile.release]
strip = true
lto = true
codegen-units = 1
