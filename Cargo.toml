[workspace]
resolver = "3"
members = ["crates/beam", "crates/fetch", "crates/measure", "crates/sshh", "crates/swoosh"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# theia. Each sibling git-dep is pinned to an EXACT rev so a `swoosh vX` tag records exactly which
# nauthy/tightbeam/bifrost commit compiled in, instead of floating on default-branch HEAD (an unpinned
# HEAD is how a past auth-bypass slipped in unnoticed). The local dev `.cargo/config.toml` still [patch]es
# these by URL to sibling PATH checkouts, so a `rev` here does NOT slow local builds: the patch wins
# locally regardless of the rev; CI (no parent config) resolves the rev from GitHub. All bifrost-* crates
# live in one repo, so they share one rev. Bump these deliberately each release (see the reproducible-build
# gate in .github/workflows/release.yml and the lock-regen step in notes/02-DECISIONS.md).
bifrost = { git = "https://github.com/theia-hq/bifrost", rev = "79574b60906d20944074179014df311228c6347c" }
bifrost-core = { git = "https://github.com/theia-hq/bifrost", rev = "79574b60906d20944074179014df311228c6347c" }
bifrost-iroh = { git = "https://github.com/theia-hq/bifrost", rev = "79574b60906d20944074179014df311228c6347c" }
bifrost-mdns = { git = "https://github.com/theia-hq/bifrost", rev = "79574b60906d20944074179014df311228c6347c" }
bifrost-mem = { git = "https://github.com/theia-hq/bifrost", rev = "79574b60906d20944074179014df311228c6347c" }
bifrost-quirk = { git = "https://github.com/theia-hq/bifrost", rev = "79574b60906d20944074179014df311228c6347c" }
nauthy = { git = "https://github.com/theia-hq/nauthy", rev = "0e9e357db137c74522d188e9147b3c62071e75bb" }
tightbeam = { git = "https://github.com/theia-hq/tightbeam", rev = "ac6614d0202b86241dd45be12b81f376e3c714ca" }
beam = { path = "crates/beam" }
fetch = { path = "crates/fetch" }
measure = { path = "crates/measure" }
sshh = { path = "crates/sshh" }

clap = { version = "4", features = ["derive", "env"] }
data-encoding = "2"
eyre = "0.6"
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
libc = "0.2"
pty-process = { version = "0.5.3", features = ["async", "tokio"] }
rand = "0.8"
russh = "0.63"
ssh-key = { version = "=0.7.0-rc.11", features = ["ed25519"] }
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "rt-multi-thread", "sync", "time"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zeroize = { version = "1", features = ["derive"] }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
wildcard_imports = "deny"
std_instead_of_core = "warn"

[workspace.lints.rust]
unused_must_use = "deny"

# Ship a lean release binary: strip symbols, whole-program LTO, single codegen unit. Roughly halves the
# artifact at no runtime cost: only a longer release link, a CI concern rather than a user's.
[profile.release]
strip = true
lto = true
codegen-units = 1
