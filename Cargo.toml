[workspace]
resolver = "3"
members = ["crates/diag", "crates/swoosh"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
diag = { path = "crates/diag" }

bifrost = { path = "../bifrost/crates/bifrost" }
bifrost-iroh = { path = "../bifrost/crates/transports/bifrost-iroh" }
bifrost-mem = { path = "../bifrost/crates/transports/bifrost-mem" }
clap = { version = "4", features = ["derive"] }
eyre = "0.6"
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
rand = "0.8"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
wildcard_imports = "deny"
std_instead_of_core = "warn"

[workspace.lints.rust]
unused_must_use = "deny"
