[package]
publish = false  # git-only for now, not published to crates.io
name = "swoosh"
description = "Reach a machine by its public key and grant one person one service: ssh, files, ports, fetch. No account."
version = "0.14.1"
edition = "2024"
rust-version = "1.91"
license = "(MIT OR Apache-2.0) AND CC-BY-3.0-US"

# No explicit `[[bin]]`: the CLI is its own module tree under the conventional `src/bin/swoosh/`, which
# Cargo's target discovery names from the directory. The library (`src/lib.rs`) is the node engine.

[features]
# `ssh` pulls in the `sshh` engine from the services repo and binds the `sshd:` handler at the serve
# root, so a default swoosh serves `tunnel expose ssh=sshd:` and `swoosh ssh` reaches it. DEFAULT-ON: the
# keyless shell is a headline capability, not an opt-in. A lean client that only reaches out
# (`ping`/`speed`/`fetch`) can drop the russh/pty tree with `--no-default-features`, keeping swoosh the
# one binary either way.
default = ["ssh"]
ssh = ["dep:sshh"]
# `swoosh::testkit`: keys and prompts for tests. Never on in a build; the package turns it on for itself
# as a dev-dependency below, so the bin's unit tests and `tests/` see it.
test-support = []

[dependencies]
# theia. Each sibling git-dep is pinned to an EXACT rev so a `swoosh vX` tag records exactly which
# nauthy/tightbeam/bifrost commit compiled in, instead of floating on default-branch HEAD (an unpinned
# HEAD is how a past auth-bypass slipped in unnoticed). The local dev `.cargo/config.toml` still [patch]es
# these by URL to sibling PATH checkouts, so a `rev` here does NOT slow local builds: the patch wins
# locally regardless of the rev; CI (no parent config) resolves the rev from GitHub. All bifrost-* crates
# live in one repo, so they share one rev. Bump these deliberately each release (see the reproducible-build
# gate in .github/workflows/release.yml and the lock-regen step in notes/02-DECISIONS.md).
bifrost = { git = "https://github.com/theia-hq/bifrost", rev = "3d1f79e84c7d8480896ef2d83120867de53a3726" }
bifrost-iroh = { git = "https://github.com/theia-hq/bifrost", rev = "3d1f79e84c7d8480896ef2d83120867de53a3726" }
bifrost-mdns = { git = "https://github.com/theia-hq/bifrost", rev = "3d1f79e84c7d8480896ef2d83120867de53a3726" }
bifrost-noise = { git = "https://github.com/theia-hq/bifrost", rev = "3d1f79e84c7d8480896ef2d83120867de53a3726" }
bifrost-quirk = { git = "https://github.com/theia-hq/bifrost", rev = "3d1f79e84c7d8480896ef2d83120867de53a3726" }
# The key file store, in its own repo, pinned to the commit that names its key kinds standard and strict
# and lets a dependent build each touch-id error in its own tests.
keystore = { git = "https://github.com/theia-hq/keystore", rev = "783c87527663b6465bd735a85cbc84551583a87e" }
nauthy = { git = "https://github.com/theia-hq/nauthy", rev = "a7c82bf58db5d54795b4a3c544da8ca7d2e0a81c" }
tightbeam = { git = "https://github.com/theia-hq/tightbeam", rev = "de0b58d72f9a922358bed3b77c0942d50bbefdd3" }
# theia services. The general engines (fetch, measure, sshh, transfer) live in one repo, pinned to one
# exact rev like the siblings above; the services repo pins the handler contract in turn, so this is the
# cascade's outermost hop. The local dev `.cargo/config.toml` [patch]es these by URL to path checkouts.
fetch = { git = "https://github.com/theia-hq/services", rev = "f1a2ef67fdf84e7bb0cde264cdabde3bc14e2fc9" }
measure = { git = "https://github.com/theia-hq/services", rev = "f1a2ef67fdf84e7bb0cde264cdabde3bc14e2fc9" }
sshh = { git = "https://github.com/theia-hq/services", rev = "f1a2ef67fdf84e7bb0cde264cdabde3bc14e2fc9", optional = true }
transfer = { git = "https://github.com/theia-hq/services", rev = "f1a2ef67fdf84e7bb0cde264cdabde3bc14e2fc9" }

# The exchange names an update by its BLAKE3 digest, so two devices learn they hold the same one without
# sending it.
blake3 = "1"
clap = { version = "4", features = ["derive", "env"] }
data-encoding = "2"
eyre = "0.6"
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
httparse = "1"
# Every change to the home takes `home.lock`, an flock, so two concurrent writers cannot lose an edit.
# The flock rides libc, matching how `sshh` already reaches for the same crate.
libc = "0.2"
rand = "0.8"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# A `proxy:<url>` is read as a URL once, at the serve entry, so a path or query is refused there rather
# than stored and shown beside a scope that ignores it; `swoosh proxy` compares origins with the same
# parser. Already in the tree through `fetch` and bifrost.
url = "2"
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
# This package, with `test-support`: the bin and `tests/` are their own crates and see the lib without
# `cfg(test)`, so this is how they reach `swoosh::testkit`.
swoosh = { path = ".", features = ["test-support"] }

# The in-process transport the `gated_measure` proof drives: two mem nodes share a global registry, so a
# client reaches the exposer by NodeId with no sockets, deterministically and in milliseconds.
bifrost-mem = { git = "https://github.com/theia-hq/bifrost", rev = "3d1f79e84c7d8480896ef2d83120867de53a3726" }

# `test-util` gives the control-client deadline test tokio's paused clock, so the 5 s read bound is
# asserted without a wall-clock wait. Dev-only: the shipped binary never compiles it in.
tokio = { version = "1", features = ["test-util"] }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
wildcard_imports = "deny"
std_instead_of_core = "warn"

[lints.rust]
unused_must_use = "deny"

# Ship a lean release binary: strip symbols, whole-program LTO, single codegen unit. Roughly halves the
# artifact at no runtime cost: only a longer release link, a CI concern rather than a user's.
[profile.release]
strip = true
lto = true
codegen-units = 1

# noq-proto 1.3.0 never bounds how many out-of-order chunks one stream buffers, so a peer can make a
# node hold gigabytes per connection with gapped stream frames (RUSTSEC-2026-0185 in quinn-proto,
# which noq forks). n0-computer/noq#828 ports quinn's three fixes; this takes its head, pinned by full
# hash, until n0 releases it. cargo honours a patch only at the workspace root, so bifrost's and
# tightbeam's own patches do not reach this build. Drop this entry, and the matching `allow-git` line
# in deny.toml, the day a noq-proto release carries #828; scripts/fork-watch.sh fails if the patch
# goes before its row in scripts/fork-watch.txt says ported.
[patch.crates-io]
noq-proto = { git = "https://github.com/n0-computer/noq", rev = "d7c3160a7e7b5cb36682eae04e364d3f50e28925" }
