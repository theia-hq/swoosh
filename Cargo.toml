[workspace]
resolver = "3"
members = ["crates/diag", "crates/swoosh"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# theia
bifrost = { git = "https://github.com/theia-hq/bifrost" }
bifrost-core = { git = "https://github.com/theia-hq/bifrost" }
bifrost-iroh = { git = "https://github.com/theia-hq/bifrost" }
bifrost-mdns = { git = "https://github.com/theia-hq/bifrost" }
bifrost-mem = { git = "https://github.com/theia-hq/bifrost" }
bifrost-quirk = { git = "https://github.com/theia-hq/bifrost" }
nauthy = { git = "https://github.com/theia-hq/nauthy" }
tightbeam = { git = "https://github.com/theia-hq/tightbeam" }
diag = { path = "crates/diag" }

clap = { version = "4", features = ["derive", "env"] }
data-encoding = "2"
eyre = "0.6"
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
rand = "0.8"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "rt-multi-thread", "sync", "time"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zeroize = { version = "1", features = ["derive"] }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
wildcard_imports = "deny"
std_instead_of_core = "warn"

[workspace.lints.rust]
unused_must_use = "deny"
