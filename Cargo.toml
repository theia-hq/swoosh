[workspace]
resolver = "3"
members = ["crates/swoosh"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# theia. Each sibling git-dep is pinned to an EXACT rev so a `swoosh vX` tag records exactly which
# nauthy/tightbeam/bifrost commit compiled in, instead of floating on default-branch HEAD (an unpinned
# HEAD is how a past auth-bypass slipped in unnoticed). The local dev `.cargo/config.toml` still [patch]es
# these by URL to sibling PATH checkouts, so a `rev` here does NOT slow local builds: the patch wins
# locally regardless of the rev; CI (no parent config) resolves the rev from GitHub. All bifrost-* crates
# live in one repo, so they share one rev. Bump these deliberately each release (see the reproducible-build
# gate in .github/workflows/release.yml and the lock-regen step in notes/02-DECISIONS.md).
bifrost = { git = "https://github.com/theia-hq/bifrost", rev = "e75a728b304b6cc2bd090dbb45c0f9e6a3dafa74" }
bifrost-core = { git = "https://github.com/theia-hq/bifrost", rev = "e75a728b304b6cc2bd090dbb45c0f9e6a3dafa74" }
bifrost-iroh = { git = "https://github.com/theia-hq/bifrost", rev = "e75a728b304b6cc2bd090dbb45c0f9e6a3dafa74" }
bifrost-mdns = { git = "https://github.com/theia-hq/bifrost", rev = "e75a728b304b6cc2bd090dbb45c0f9e6a3dafa74" }
bifrost-mem = { git = "https://github.com/theia-hq/bifrost", rev = "e75a728b304b6cc2bd090dbb45c0f9e6a3dafa74" }
bifrost-noise = { git = "https://github.com/theia-hq/bifrost", rev = "e75a728b304b6cc2bd090dbb45c0f9e6a3dafa74" }
bifrost-quirk = { git = "https://github.com/theia-hq/bifrost", rev = "e75a728b304b6cc2bd090dbb45c0f9e6a3dafa74" }
nauthy = { git = "https://github.com/theia-hq/nauthy", rev = "4086838c65f176a402a746ced0b7f76992171301" }
tightbeam = { git = "https://github.com/theia-hq/tightbeam", rev = "937a4fbdd88ed7ff494ac9d21160bb8afdc2280b" }
# theia services. The general engines (fetch, measure, sshh, transfer) live in one repo, pinned to one
# exact rev like the siblings above; the services repo pins the handler contract in turn, so this is the
# cascade's outermost hop. The local dev `.cargo/config.toml` [patch]es these by URL to path checkouts.
fetch = { git = "https://github.com/theia-hq/services", rev = "426482adec279fa5910b642b744fb3a7a7ef672b" }
measure = { git = "https://github.com/theia-hq/services", rev = "426482adec279fa5910b642b744fb3a7a7ef672b" }
sshh = { git = "https://github.com/theia-hq/services", rev = "426482adec279fa5910b642b744fb3a7a7ef672b" }
transfer = { git = "https://github.com/theia-hq/services", rev = "426482adec279fa5910b642b744fb3a7a7ef672b" }

clap = { version = "4", features = ["derive", "env"] }
data-encoding = "2"
eyre = "0.6"
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
libc = "0.2"
rand = "0.8"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zeroize = { version = "1", features = ["derive"] }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
wildcard_imports = "deny"
std_instead_of_core = "warn"

[workspace.lints.rust]
unused_must_use = "deny"

# Ship a lean release binary: strip symbols, whole-program LTO, single codegen unit. Roughly halves the
# artifact at no runtime cost: only a longer release link, a CI concern rather than a user's.
[profile.release]
strip = true
lto = true
codegen-units = 1
